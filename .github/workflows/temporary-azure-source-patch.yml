name: Temporary Azure source patch
on:
  push:
    branches:
      - azure-dev
jobs:
  apply:
    if: github.event.head_commit.message == 'TEMP APPLY AZURE PATCH'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: azure-dev
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply focused Azure source changes
        run: python3 ci/patch_azure_source.py
      - name: Commit source changes to azure-dev
        run: |
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Capri.cs app/Computer.cs app/Brain.cs
          git commit -m "Align Windows smoke tests with Azure security"
          git push origin HEAD:azure-dev
