name: Windows full smoke

on:
  push:
    branches:
      - azure-dev
    paths:
      - .github/workflows/windows-full-smoke.yml
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: windows-full-smoke-azure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-full-smoke:
    runs-on: windows-2025
    timeout-minutes: 40
    # Covers Azure identity, transcript labels, safe SECURITY presets and provider isolation, the file editor, the current personality stamp, all three memory modes and the 30-minute runtime soak.
    steps:
      - uses: actions/checkout@v5
      - name: Prepare full-size desktop
        shell: powershell
        run: ./ci/wide-screen.ps1
      - name: Build and run complete smoke suite
        shell: pwsh
        run: ./ci/build-windows.ps1 -OutputDirectory out/windows -SmokeTest -SmokeSeconds 1800
      - name: Upload full smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-full-smoke
          path: out/windows/smoke
          if-no-files-found: warn
